# Production override: run the images CI pushed to GHCR instead of building locally,
# and keep internal ports off the public interface.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  app:
    image: ${IMAGE_REPO:-ghcr.io/nagajaideep/settlewatch}:${IMAGE_TAG:-latest}
    build: !reset null
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx384m -XX:+ExitOnOutOfMemoryError"
  sre-bot:
    image: ${IMAGE_REPO:-ghcr.io/nagajaideep/settlewatch}-sre-bot:${IMAGE_TAG:-latest}
    build: !reset null
    restart: unless-stopped
    ports: !reset []
  prometheus:
    restart: unless-stopped
    ports: !reset []
  alertmanager:
    restart: unless-stopped
    ports: !reset []
  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
