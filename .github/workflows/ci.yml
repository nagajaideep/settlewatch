name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests (Testcontainers PostgreSQL)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  python:
    name: SRE bot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sre-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sre-bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  config:
    name: Monitoring config checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grafana dashboard JSON is generated from tools/build_dashboard.py
        run: |
          python3 tools/build_dashboard.py
          git diff --exit-code docker/grafana/dashboards/
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate docker-compose files
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  images:
    name: Build & publish images
    needs: [java, python, config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "app=$repo" >> "$GITHUB_OUTPUT"
          echo "bot=$repo-sre-bot" >> "$GITHUB_OUTPUT"
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.names.outputs.app }}:latest
            ${{ steps.names.outputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: SRE bot image
        uses: docker/build-push-action@v6
        with:
          context: sre-bot
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.names.outputs.bot }}:latest
            ${{ steps.names.outputs.bot }}:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
      - name: Trigger Render redeploy (if configured)
        if: env.PUSH == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping"
          fi
